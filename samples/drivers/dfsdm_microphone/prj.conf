CONFIG_DFSDM_STM32=y
CONFIG_GPIO=y
CONFIG_DMA=y
CONFIG_DFSDM=y
CONFIG_LOG=y
CONFIG_DFSDM_LOG_LEVEL_DBG=y

# --- Legacy USB Stack Settings ---
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Zephyr CDC ACM Console"

# --- Serial Console Settings ---
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_STDOUT_CONSOLE=y

# --- THE FIX: Disable the New Stack ---
# The Giga R1 enables these by default in Zephyr 4.3.
# We must disable them to avoid "Multiple Definition" errors.
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_DEVICE_DRIVER=n
CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_STM32_CUBE=y


CONFIG_DEBUG=y
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_STACK_SENTINEL=y

CONFIG_BOOT_BANNER=n
